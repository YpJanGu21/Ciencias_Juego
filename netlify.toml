# Configuración de despliegue para Netlify.
# El juego es 100% estático: no necesita backend ni variables de entorno.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Fallback para que cualquier ruta desconocida sirva la SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los assets con hash de Vite pueden cachearse de forma indefinida.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML debe revalidarse para que los nuevos deploys se vean al instante.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Permite probar el sitio con `netlify dev` usando Vite.
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
